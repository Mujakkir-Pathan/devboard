nameOverride: ""
fullnameOverride: ""
observability:
  enabled: true
  otlpGrpcEndpoint: otel-collector-gateway.observability.svc.cluster.local:4317
  otlpHttpEndpoint: http://otel-collector-gateway.observability.svc.cluster.local:4318
externalSecrets:
  enabled: true
  secretKey: devboard/postgres
  storeName: aws-secrets-manager
  refreshInterval: 1h
postgres:
  image: postgres:16-alpine
  serviceName: postgres
  storage:
    size: 1Gi
    storageClassName: "gp3"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
backend:
  image:
    repository: mujakkirpathan/devboard-backend
    tag: sha-45df65a
    pullPolicy: IfNotPresent
  replicas: 1
  serviceName: backend
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
frontend:
  image:
    repository: mujakkirpathan/devboard-frontend
    tag: sha-45df65a
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 4173
  servicePort: 8080
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
ai:
  enabled: true
  image:
    repository: mujakkirpathan/devboard-ai-service
    tag: sha-45df65a
    pullPolicy: IfNotPresent
  replicas: 1
  serviceName: ai-service
  port: 3005
  taskServiceUrl: http://backend:8080
  ollamaUrl: http://ollama.ollama.svc.cluster.local:11434/v1
  modelName: llama3.2:1b
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
gateway:
  enabled: true
  className: envoy
  listenerPort: 80
  # Empty accepts any Host, which is what the raw load balancer URL needs.
  hostname: ""
  # Off by default: the chart must still work with no cert-manager and no domain.
  tls:
    enabled: false
    port: 443
    # Must be in the Gateway's namespace. Empty -> "<fullname>-tls".
    secretName: ""
    createCertificate: true
    issuerRef:
      name: letsencrypt-prod
      kind: ClusterIssuer
    httpsRedirect: true
# The shared ClusterIssuers in gitops/cert-manager/ hard-wire their solver to the
# RAW stack's Gateway, so the Helm stack needs its own Issuer. Each stack gets
# its own load balancer, so they need separate hostnames and DNS records.
certManager:
  createIssuer: false
  issuerName: ""
  server: https://acme-v02.api.letsencrypt.org/directory
  email: trainwithshubham@gmail.com
