name: GitOps Image Bump

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

concurrency:
  group: gitops-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the fetch/reset loop below needs real history

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Write image refs, commit and push
        env:
          OWNER: ${{ vars.DOCKERHUB_USERNAME }}
          TAG: ${{ inputs.image_tag }}
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Render the refs. RAW manifests (if present): surgical sed on the
          # single "image:" line, keeping the file's formatting/comments
          # untouched. HELM values (if present): structured repository/tag —
          # owner written too, so it can't drift from what CI pushed.
          apply_refs() {
            for svc in backend frontend ai-service; do
              f="k8s/${svc}-deployment.yml"
              if [ -f "$f" ]; then
                sed -i "s|image: .*devboard-${svc}:.*|image: ${OWNER}/devboard-${svc}:${TAG}|" "$f"
              fi
            done
            v="helm/devboard/values.yaml"
            if [ -f "$v" ]; then
              yq -i ".backend.image.repository  = \"${OWNER}/devboard-backend\"    | .backend.image.tag  = \"${TAG}\"" "$v"
              yq -i ".frontend.image.repository = \"${OWNER}/devboard-frontend\"   | .frontend.image.tag = \"${TAG}\"" "$v"
              yq -i ".ai.image.repository       = \"${OWNER}/devboard-ai-service\" | .ai.image.tag       = \"${TAG}\"" "$v"
            fi
          }

          # Push to whatever branch triggered us, so this keeps working on
          # mega-project, on gitops, or on a fork's branch.
          #
          # Each attempt starts from the current remote tip and re-renders the
          # refs on top instead of `git pull --rebase`-ing our commit: a
          # previous run's bump targets the same lines with a different tag, so
          # rebasing over it always conflicts — and a conflicted pull left
          # unmerged files that made every retry in the old loop fail.
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            apply_refs

            # Scope the add. `git add -A` in a job that also downloads yq is how
            # you accidentally commit a 40 MB binary.
            git add k8s helm/devboard/values.yaml
            if git diff --cached --quiet; then
              echo "Manifests already at ${TAG}; nothing to commit."
              exit 0
            fi
            git commit -m "ci: deploy ${TAG} [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push rejected (attempt ${i}); retrying..."
            sleep $((i * 5))
          done
          exit 1
