services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_HOST_PORT}:5432"

  backend:
    build: ./backend
    image: mujakkirpathan/devboard-backend:${IMAGE_TAG:-latest}
    environment:
      PORT: "${BACKEND_PORT}"
      POSTGRES_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_PORT}"   # host:container — direct curl/debug; the UI uses the gateway

  frontend:
    build: ./frontend
    image: mujakkirpathan/devboard-frontend:${IMAGE_TAG:-latest}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT}:4173"   # vite preview serves on 4173 inside the container

  ai-service:
    build: ./ai-service
    image: mujakkirpathan/devboard-ai-service:${IMAGE_TAG:-latest}
    environment:
      PORT: "3005"
      TASK_SERVICE_URL: "http://backend:8080"
      MODEL_API_BASE: "${MODEL_API_BASE:-http://host.docker.internal:11434/v1}"
      MODEL_NAME: "${MODEL_NAME:-llama3.2:1b}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama running on the host
    depends_on:
      - backend
    ports:
      - "${AI_HOST_PORT:-3005}:3005"   # direct curl/debug; the UI uses the /api/ai proxy

volumes:
  pgdata:
